# Génère les installateurs du logiciel PC (Windows .exe, macOS .dmg, Linux AppImage/.deb).
# Lancement : pousser un tag « v1.0.0 » (crée une version GitHub téléchargeable)
# ou bouton « Run workflow » dans l'onglet Actions (fichiers dans les artefacts).
name: Application PC

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier une version GitHub (tag v<version de package.json>)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Installateur
        run: npx electron-builder --publish never
        env:
          # pas de certificat de signature : les systèmes afficheront un avertissement au premier lancement
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cap-budget-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    # publie même si un système a échoué ou a été annulé (ex. file d'attente macOS)
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cap Budget ${{ steps.version.outputs.tag }}
          make_latest: true
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Installateurs du logiciel Cap Budget.
            - Windows : `Cap-Budget-…-win-x64.exe` (si SmartScreen s'affiche : « Informations complémentaires » puis « Exécuter quand même »)
            - macOS : `.dmg` (au premier lancement : clic droit sur l'application puis « Ouvrir »)
            - Linux : `.AppImage` (rendre exécutable) ou `.deb`
