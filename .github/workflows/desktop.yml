# Génère les installateurs du logiciel PC (Windows .exe, macOS .dmg, Linux AppImage/.deb)
# et les publie dans une version GitHub, chaque système dès qu'il est prêt.
# Lancement : bouton « Run workflow » dans l'onglet Actions (tag v<version de package.json>)
# ou push d'un tag « v1.2.0 ».
name: Application PC

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier une version GitHub (tag v<version de package.json>)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Créer la version
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cap Budget ${{ steps.version.outputs.tag }}
          make_latest: true
          body: |
            Installateurs du logiciel Cap Budget (ils apparaissent ci-dessous au fur et à mesure de leur fabrication).
            - **Windows** : `Cap-Budget-…-win-x64.exe`. Si SmartScreen s'affiche : « Informations complémentaires » puis « Exécuter quand même ».
            - **macOS** : `.dmg`. Au premier lancement : clic droit sur l'application puis « Ouvrir ».
            - **Linux** : `.AppImage` (rendre exécutable) ou `.deb`.

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Installateur
        run: npx electron-builder --publish never
        env:
          # pas de certificat de signature : les systèmes afficheront un avertissement au premier lancement
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cap-budget-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30
      - name: Ajouter à la version
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # latest*.yml et .blockmap : lus par les mises à jour automatiques du logiciel
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
