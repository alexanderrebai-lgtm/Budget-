# Génère les installateurs du logiciel PC (Windows .exe, macOS .dmg, Linux AppImage/.deb).
# Lancement : pousser un tag « v1.0.0 » (crée une version GitHub téléchargeable)
# ou bouton « Run workflow » dans l'onglet Actions (fichiers dans les artefacts).
name: Application PC

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Installateur
        run: npx electron-builder --publish never
        env:
          # pas de certificat de signature : les systèmes afficheront un avertissement au premier lancement
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cap-budget-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Cap Budget ${{ github.ref_name }}
          files: artifacts/*
          body: |
            Installateurs du logiciel Cap Budget.
            - Windows : `Cap-Budget-…-win-x64.exe` (si SmartScreen s'affiche : « Informations complémentaires » puis « Exécuter quand même »)
            - macOS : `.dmg` (au premier lancement : clic droit sur l'application puis « Ouvrir »)
            - Linux : `.AppImage` (rendre exécutable) ou `.deb`
